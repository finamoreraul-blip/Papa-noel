<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda de Ropa - Tres Arroyos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
:root{--rosa:#ff2e7a;--fondo:#0f0f10;--card:#1c1c1e;--borde:#2a2a2e;--texto:#f5f5f5;--texto2:#b0b0b0}
body{background:var(--fondo);color:var(--texto);font-size:17px}
header{background:#111;border-bottom:3px solid var(--rosa);padding:22px 20px;text-align:center;position:sticky;top:0;z-index:50}
header h1{color:var(--rosa);font-size:2rem}
header p{color:var(--texto2);font-size:1.1rem}
.filtros{max-width:1100px;margin:20px auto 0;display:flex;gap:10px;flex-wrap:wrap;padding:0 16px}
.filtros button{background:var(--card);color:var(--texto);border:1px solid var(--borde);padding:10px 20px;border-radius:25px;cursor:pointer;font-size:1rem}
.filtros button.activo{background:var(--rosa);border-color:var(--rosa)}
.grid{max-width:1100px;margin:20px auto 130px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--borde);border-radius:20px;overflow:hidden}
.mini-carrusel{position:relative;height:320px;background:#000;overflow:hidden}
.mini-carrusel img{width:100%;height:320px;object-fit:cover;display:none;cursor:zoom-in}
.mini-carrusel img.activo{display:block;animation:fade .5s}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.mini-puntos{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.mini-punto{width:9px;height:9px;background:rgba(255,255,255,.5);border-radius:50%}
.mini-punto.activo{background:var(--rosa)}
.card-body{padding:16px}
.card-body h3{font-size:1.25rem}
.precio{color:var(--rosa);font-weight:800;font-size:1.4rem;margin:6px 0}
.card-body p{font-size:1rem;color:var(--texto2);min-height:48px}
.talles-mini{margin:6px 0;font-size:.9rem;color:white}
.btn{background:var(--rosa);color:white;border:none;padding:13px 12px;border-radius:12px;cursor:pointer;width:100%;font-weight:700;font-size:1.1rem;margin-top:8px}
.float-wa{position:fixed;bottom:20px;left:20px;background:#25D366;color:white;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;text-decoration:none;z-index:60}
.float-cart{position:fixed;bottom:20px;right:20px;background:var(--rosa);color:white;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;z-index:60}
.cart-count{position:absolute;top:-4px;right:-4px;background:white;color:black;font-size:.9rem;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.drawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100%;background:var(--card);transition:right .3s;z-index:100;display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer-header{padding:18px;background:#141416;display:flex;justify-content:space-between;font-weight:700;font-size:1.2rem}
.drawer-body{flex:1;overflow-y:auto;padding:14px}
.cart-item{display:flex;gap:10px;margin-bottom:12px;background:#141416;padding:10px;border-radius:12px;align-items:center;font-size:1rem}
.cart-item img{width:60px;height:60px;border-radius:10px;object-fit:cover}
.modal,.panel-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.open,.panel-modal.open{display:flex}
.modal-box,.panel-box{background:var(--card);border:1px solid var(--borde);border-radius:20px;max-width:600px;width:100%;max-height:92vh;overflow-y:auto;padding:20px}
.modal-carrusel{position:relative;height:400px;background:#000;border-radius:16px;overflow:hidden}
.modal-carrusel img{width:100%;height:400px;object-fit:cover;display:none}
.modal-carrusel img.activo{display:block}
.modal-puntos{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.modal-punto{width:10px;height:10px;background:rgba(255,255,255,.5);border-radius:50%;cursor:pointer}
.modal-punto.activo{background:var(--rosa)}
.talle-btn{display:inline-block;margin:5px;padding:10px 16px;border-radius:10px;border:1px solid var(--borde);background:#141416;color:white;cursor:pointer;font-size:1.1rem}
.talle-btn.sel{background:var(--rosa);border-color:var(--rosa)}
.panel-btn{position:fixed;bottom:100px;right:20px;background:white;color:black;border:none;width:60px;height:60px;border-radius:50%;cursor:pointer;z-index:60;font-size:26px}
.panel-box input,.panel-box textarea,.panel-box select{width:100%;padding:13px;border:1px solid var(--borde);border-radius:12px;margin:8px 0;background:#141416;color:white;font-size:1.1rem}
.small{font-size:.95rem;color:var(--texto2)}
.foto-prev{display:inline-block;position:relative;margin:5px}
.foto-prev img{width:90px;height:90px;border-radius:10px;object-fit:cover}
.foto-prev button{position:absolute;top:-6px;right:-6px;background:red;color:white;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer}
</style>
</head>
<body>

<header>
<h1>👗 Tienda de Ropa</h1>
<p>Tres Arroyos - Envíos a todo el país - Precios en Pesos</p>
</header>

<div class="filtros" id="filtros"></div>
<div class="grid" id="grid"></div>

<a class="float-wa" id="waFloat" href="#" target="_blank">💬</a>
<div class="float-cart" onclick="toggleCart(true)">🛒<span class="cart-count" id="cartCount">0</span></div>
<button class="panel-btn" onclick="abrirPanel()">⚙️</button>

<div class="drawer" id="drawer">
<div class="drawer-header">Tu Carrito <button onclick="toggleCart(false)" style="background:#333;color:white;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer">✕</button></div>
<div class="drawer-body" id="cartBody"></div>
<div style="padding:16px;border-top:1px solid var(--borde)">
<div style="font-weight:800;margin-bottom:10px;font-size:1.2rem">Total: <span id="cartTotal">$ 0</span></div>
<button class="btn" style="background:#25D366" onclick="enviarWhatsApp()">Enviar pedido por WhatsApp</button>
</div>
</div>

<div class="modal" id="modalProd">
<div class="modal-box">
<button onclick="cerrarModal()" style="float:right;background:#333;color:white;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px">✕</button>
<div class="modal-carrusel" id="modalCarrusel"></div>
<h2 id="mTitle" style="margin:12px 0 4px;font-size:1.6rem"></h2>
<div class="precio" id="mPrice"></div>
<p id="mDesc" style="margin:12px 0;color:var(--texto2);font-size:1.1rem"></p>
<p id="mStock" class="small"></p>
<h3 style="margin-top:12px">Talle:</h3>
<div id="mTalles"></div>
<button class="btn" onclick="agregarDesdeModal()">Agregar al carrito 🛒</button>
</div>
</div>

<div class="panel-modal" id="panelModal">
<div class="panel-box">
<h2>Panel - Cargar Publicación</h2>
<div id="loginBox">
<input type="password" id="passInput" placeholder="Contraseña (admin123)">
<button class="btn" onclick="login()">Entrar</button>
</div>
<div id="adminBox" style="display:none">

<label>Número WhatsApp (ej: 5492983123456)</label>
<input id="waNumber" placeholder="549...">
<button class="btn" style="background:#555" onclick="guardarWA()">Guardar WhatsApp</button>
<hr style="margin:14px 0;border-color:var(--borde)">

<h3>NUEVA PUBLICACIÓN - 3 FOTOS</h3>
<label>Nombre del modelo</label>
<input id="pName" placeholder="Ej: Vestido midi floreado">
<label>Precio en ARS</label>
<input id="pPrice" type="number" placeholder="25000">
<label>Descripción</label>
<textarea id="pDesc" rows="3" placeholder="Tela, medidas, color..."></textarea>
<label>Categoría</label>
<input id="pCat" placeholder="Ej: Vestidos, Tops, Pantalones">
<label>Talles disponibles (separados por coma)</label>
<input id="pTalles" placeholder="Ej: S, M, L, XL">
<label>Stock</label>
<input id="pStock" type="number" placeholder="5">
<label>Fotos del producto (elegí hasta 3, se suben juntas)</label>
<input type="file" id="pFotoFile" accept="image/*" multiple onchange="previsualizarFotos(event)">
<div id="previewBox" style="border:2px dashed var(--borde);border-radius:12px;padding:10px;text-align:center;margin:10px 0">
<p id="pPreviewText" class="small">Vista previa de las fotos</p>
<div id="pPreviewGrid"></div>
</div>
<button class="btn" onclick="guardarProducto()">Guardar Publicación</button>
<h3 style="margin-top:18px">Publicaciones cargadas</h3>
<div id="listaAdmin"></div>
</div>
</div>
</div>

<script>
const WA_KEY='ropa_wa';
const PASS_KEY='ropa_pass';
const LOCAL_KEY='ropa_productos_local';
let fotosMuestra=[
  "https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=800",
  "https://images.unsplash.com/photo-1509631179647-0177331693ae?w=800",
  "https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=800"
];
let fotosMuestra2=[
  "https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800",
  "https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=800",
  "https://images.unsplash.com/photo-1445205170230-053b83016050?w=800"
];
let fotosMuestra3=[
  "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=800",
  "https://images.unsplash.com/photo-1542272604-787c3835535d?w=800",
  "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=800"
];
let fotosMuestra4=[
  "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800",
  "https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=800",
  "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=800"
];
let productosMuestra=[
  {id:1,nombre:"Vestido Midi Floral Verano",precio:28500,descripcion:"Vestido midi con estampa floral, tela fresquita de rayon. Ideal para el verano.",categoria:"Vestidos",talles:"S, M, L, XL",stock:8,fotos:fotosMuestra},
  {id:2,nombre:"Conjunto Top + Pollera",precio:32000,descripcion:"Conjunto de top y pollera midi, tela elastizada que se adapta a todos los talles.",categoria:"Conjuntos",talles:"S, M, L",stock:5,fotos:fotosMuestra2},
  {id:3,nombre:"Jean Mom + Campera de Jean",precio:45000,descripcion:"Jean mom tiro alto elastizado + campera de jean oversize. Combinalos como quieras.",categoria:"Jeans",talles:"36, 38, 40, 42",stock:6,fotos:fotosMuestra3},
  {id:4,nombre:"Remera Oversize Blanca",precio:15000,descripcion:"Remera oversize de algodon peinado, fresca y super combinable.",categoria:"Remeras",talles:"S, M, L, XL",stock:12,fotos:fotosMuestra4}
];
let products=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');
if(!products || products.length===0){
  products=productosMuestra;
  localStorage.setItem(LOCAL_KEY,JSON.stringify(products));
}
let cart=JSON.parse(localStorage.getItem('ropa_cart_v2')||'[]');
let filtroActual='Todos';
let productoModal=null;
let talleSeleccionado=null;
let fotosTemp=[];
let modalFotos=[];
let modalIdx=0;
let modalTimer=null;

function getWA(){return localStorage.getItem(WA_KEY)||'5492983123456'}
function getPass(){return localStorage.getItem(PASS_KEY)||'admin123'}
function fmt(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n)}

function renderTodo(){
  const cats=['Todos',...new Set(products.map(p=>p.categoria).filter(Boolean))];
  document.getElementById('filtros').innerHTML=cats.map(c=>`<button class="${c===filtroActual?'activo':''}" onclick="filtroActual='${c}';renderTodo()">${c}</button>`).join('');
  const lista=products.filter(p=>filtroActual==='Todos'||p.categoria===filtroActual);
  const g=document.getElementById('grid');
  g.innerHTML=lista.map(p=>{
    const fotos=(p.fotos && p.fotos.length)?p.fotos:(p.foto?[p.foto]:['https://via.placeholder.com/600']);
    const talles=(p.talles||'').split(',').filter(Boolean).join(' • ');
    let imgs=fotos.map((f,i)=>`<img src="${f}" class="${i===0?'activo':''}" onclick="abrirModal(${p.id})">`).join('');
    let puntos=fotos.map((_,i)=>`<div class="mini-punto ${i===0?'activo':''}"></div>`).join('');
    return `<div class="card">
      <div class="mini-carrusel" data-id="${p.id}">${imgs}<div class="mini-puntos">${puntos}</div></div>
      <div class="card-body">
        <h3>${p.nombre}</h3>
        <div class="precio">${fmt(Number(p.precio))}</div>
        <p>${p.descripcion||''}</p>
        <div class="talles-mini">Talles: ${talles||'Único'}</div>
        <button class="btn" onclick="abrirModal(${p.id})">Ver y Elegir Talle</button>
      </div>
    </div>`;
  }).join('')||'<p style="grid-column:1/-1;text-align:center">Todavía no hay publicaciones. Cargá desde el panel ⚙️</p>';
  renderAdminList();actualizarCart();
}

// Carrusel de cada tarjeta que pasa solo
setInterval(()=>{
  document.querySelectorAll('.mini-carrusel').forEach(c=>{
    const imgs=c.querySelectorAll('img');
    if(imgs.length<2)return;
    let actual=[...imgs].findIndex(i=>i.classList.contains('activo'));
    imgs[actual].classList.remove('activo');
    c.querySelectorAll('.mini-punto')[actual].classList.remove('activo');
    let sig=(actual+1)%imgs.length;
    imgs[sig].classList.add('activo');
    c.querySelectorAll('.mini-punto')[sig].classList.add('activo');
  });
},3000);

function abrirModal(id){
  productoModal=products.find(p=>String(p.id)===String(id));
  talleSeleccionado=null;
  modalFotos=(productoModal.fotos && productoModal.fotos.length)?productoModal.fotos:(productoModal.foto?[productoModal.foto]:['https://via.placeholder.com/600']);
  modalIdx=0;
  document.getElementById('modalCarrusel').innerHTML=modalFotos.map((f,i)=>`<img src="${f}" class="${i===0?'activo':''}">`).join('')+`<div class="modal-puntos">${modalFotos.map((_,i)=>`<div class="modal-punto ${i===0?'activo':''}" onclick="irModalSlide(${i})"></div>`).join('')}</div>`;
  document.getElementById('mTitle').textContent=productoModal.nombre;
  document.getElementById('mPrice').textContent=fmt(Number(productoModal.precio));
  document.getElementById('mDesc').textContent=productoModal.descripcion||'';
  document.getElementById('mStock').textContent='Stock disponible: '+(productoModal.stock||'');
  const talles=(productoModal.talles||'').split(',').map(t=>t.trim()).filter(Boolean);
  document.getElementById('mTalles').innerHTML=talles.length? talles.map(t=>`<span class="talle-btn" onclick="selTalle(this,'${t}')">${t}</span>`).join('') : `<span class="talle-btn sel">Talle Único</span>`;
  if(!talles.length)talleSeleccionado='Único';
  document.getElementById('modalProd').classList.add('open');
  clearInterval(modalTimer);
  modalTimer=setInterval(()=>{irModalSlide(modalIdx+1)},3500);
}
function irModalSlide(i){
  if(modalFotos.length<2)return;
  modalIdx=i;
  if(modalIdx>=modalFotos.length)modalIdx=0;
  if(modalIdx<0)modalIdx=modalFotos.length-1;
  document.querySelectorAll('#modalCarrusel img').forEach((img,idx)=>img.classList.toggle('activo',idx===modalIdx));
  document.querySelectorAll('#modalCarrusel .modal-punto').forEach((p,idx)=>p.classList.toggle('activo',idx===modalIdx));
}
function selTalle(el,t){document.querySelectorAll('.talle-btn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');talleSeleccionado=t}
function cerrarModal(){document.getElementById('modalProd').classList.remove('open');clearInterval(modalTimer)}
function agregarDesdeModal(){
  if(!talleSeleccionado) return alert('Elegí un talle');
  agregarCarrito(productoModal.id, talleSeleccionado);
  cerrarModal();
}
function agregarCarrito(id, talle){
  const key=id+'_'+talle;
  const it=cart.find(i=>i.key===key);
  if(it)it.qty++; else cart.push({key,id,qty:1,talle});
  localStorage.setItem('ropa_cart_v2',JSON.stringify(cart));actualizarCart();
}
function actualizarCart(){
  document.getElementById('cartCount').textContent=cart.reduce((a,i)=>a+i.qty,0);
  let total=0,html='';
  cart.forEach(i=>{
    const p=products.find(pr=>String(pr.id)===String(i.id));if(!p)return;
    const fotoPrincipal=(p.fotos&&p.fotos[0])||p.foto||'https://via.placeholder.com/100';
    total+=Number(p.precio)*i.qty;
    html+=`<div class="cart-item"><img src="${fotoPrincipal}"><div style="flex:1"><b>${p.nombre}</b><br>${fmt(Number(p.precio))} x ${i.qty}<br><small>Talle: ${i.talle}</small></div><button onclick="quitarItem('${i.key}')" style="background:#333;color:white;border:none;padding:8px;border-radius:8px">🗑</button></div>`;
  });
  document.getElementById('cartBody').innerHTML=html||'<p style="text-align:center;color:#999;margin-top:20px">Carrito vacío</p>';
  document.getElementById('cartTotal').textContent=fmt(total);
}
function quitarItem(key){cart=cart.filter(i=>i.key!==key);localStorage.setItem('ropa_cart_v2',JSON.stringify(cart));actualizarCart()}
function toggleCart(open){document.getElementById('drawer').classList.toggle('open',open)}
function enviarWhatsApp(){
  if(!cart.length)return alert('Carrito vacío');
  let msg='Hola! Quiero pedir:%0A%0A',total=0;
  cart.forEach(i=>{
    const p=products.find(pr=>String(pr.id)===String(i.id));if(!p)return;
    msg+=`• ${p.nombre} (Talle ${i.talle}) x${i.qty} - ${fmt(Number(p.precio)*i.qty)}%0A`;
    total+=Number(p.precio)*i.qty;
  });
  msg+=`%0ATotal: ${fmt(total)}%0AEntrega en Tres Arroyos`;
  window.open(`https://wa.me/${getWA()}?text=${msg}`,'_blank');
}

function abrirPanel(){document.getElementById('panelModal').classList.add('open');document.getElementById('waNumber').value=getWA();renderAdminList()}
function login(){if(document.getElementById('passInput').value===getPass()){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block'}else alert('Clave incorrecta')}
function guardarWA(){localStorage.setItem(WA_KEY,document.getElementById('waNumber').value.trim());alert('WhatsApp guardado')}

function comprimirImagen(file,cb){
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      const max=900;
      let w=img.width,h=img.height;
      if(w>max){h=h*max/w;w=max}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.8));
    }
    img.src=ev.target.result;
  }
  reader.readAsDataURL(file);
}
function previsualizarFotos(e){
  const files=[...e.target.files].slice(0,3);
  if(files.length===0)return;
  fotosTemp=[];
  document.getElementById('pPreviewGrid').innerHTML='';
  files.forEach(f=>{
    comprimirImagen(f,function(b64){
      fotosTemp.push(b64);
      document.getElementById('pPreviewGrid').innerHTML+=`<div class="foto-prev"><img src="${b64}"></div>`;
      document.getElementById('pPreviewText').style.display='none';
    });
  });
}

async function guardarProducto(){
  const nombre=document.getElementById('pName').value.trim();
  const precio=document.getElementById('pPrice').value;
  if(!nombre||!precio)return alert('Nombre y precio son obligatorios');
  if(fotosTemp.length===0)return alert('Subí al menos 1 foto');
  const body={
    id:Date.now(),
    nombre,
    precio,
    descripcion:document.getElementById('pDesc').value,
    categoria:document.getElementById('pCat').value,
    talles:document.getElementById('pTalles').value,
    stock:document.getElementById('pStock').value,
    fotos:fotosTemp
  };
  products.push(body);
  localStorage.setItem(LOCAL_KEY,JSON.stringify(products));
  fotosTemp=[];
  document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pDesc').value='';
  document.getElementById('pCat').value='';document.getElementById('pTalles').value='';document.getElementById('pStock').value='';document.getElementById('pFotoFile').value='';
  document.getElementById('pPreviewGrid').innerHTML='';document.getElementById('pPreviewText').style.display='block';
  renderTodo();alert('Publicación guardada con '+body.fotos.length+' foto(s)!');
}
function renderAdminList(){
  document.getElementById('listaAdmin').innerHTML=products.map(p=>{
    const fotoPrincipal=(p.fotos&&p.fotos[0])||p.foto||'https://via.placeholder.com/100';
    return `<div style="display:flex;gap:10px;align-items:center;background:#141416;padding:8px;border-radius:10px;margin:8px 0"><img src="${fotoPrincipal}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><div style="flex:1"><b>${p.nombre}</b><br>${fmt(Number(p.precio))} - ${p.categoria||'Sin cat'} - Talles: ${p.talles||'Único'}<br><small>${(p.fotos||[]).length} foto(s)</small></div><button onclick="borrarProd('${p.id}')" style="background:#3a0a18;color:white;border:none;padding:8px;border-radius:8px">Borrar</button></div>`;
  }).join('')||'<p class="small">Sin publicaciones</p>';
}
function borrarProd(id){
  products=products.filter(p=>String(p.id)!==String(id));
  localStorage.setItem(LOCAL_KEY,JSON.stringify(products));
  renderTodo();
}
