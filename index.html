<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papá Noel Pro</title>
<style>
    * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, #145a40, #0b3d2e 70%);
    color: white;
    min-height: 100vh;
    text-align: center;
  }
  #panel { padding: 20px; max-width: 600px; margin: 0 auto; }
  #panel h1 { color: gold; font-size: 36px; margin-bottom: 5px; }
  .preview-img {
    width: 200px; height: 200px; object-fit: cover;
    border-radius: 50%; border: 4px solid gold; margin: 15px 0;
  }
  textarea, input[type="text"] {
    width: 100%; border-radius: 12px; border: none;
    padding: 12px; font-size: 16px; margin-top: 10px;
  }
  textarea { height: 110px; }
  button {
    margin: 10px 5px 0 5px; background: #d62828; color: white;
    border: none; padding: 14px 28px; font-size: 18px;
    border-radius: 30px; cursor: pointer; font-weight: bold;
  }
  button.music-btn { background: #1d6fa5; }

  #escena {
    display: none; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 20px;
    background: radial-gradient(circle at 50% 30%, #1a6b4a, #06231a 80%);
  }
  .foto-wrap { position: relative; display: inline-block; }
  #santaGrande {
    width: min(80vw, 500px); height: min(80vw, 500px);
    object-fit: cover; border-radius: 50%;
    border: 8px solid gold; box-shadow: 0 0 60px rgba(255,215,0,0.7);
    transition: transform 0.15s;
  }
  /* Cara moviéndose */
  #santaGrande.hablando {
    animation: caraHabla 0.5s infinite;
  }
  @keyframes caraHabla {
    0% { transform: scale(1) rotate(-1deg); }
    50% { transform: scale(1.04) rotate(1deg); }
    100% { transform: scale(1) rotate(-1deg); }
  }
  #santaGrande.riendo {
    animation: caraRisa 0.4s infinite;
  }
  @keyframes caraRisa {
    0% { transform: scale(1.02) rotate(-2deg); }
    50% { transform: scale(1.08) rotate(2deg); }
    100% { transform: scale(1.02) rotate(-2deg); }
  }
  /* Boca */
  #boca {
    position: absolute; left: 50%; top: 56%;
    width: 90px; height: 40px;
    background: #3d0a0a; border-radius: 50%;
    transform: translateX(-50%) scaleY(0.15);
    border: 3px solid #ffcccc;
    transition: transform 0.08s;
  }
  #boca.abierto {
    transform: translateX(-50%) scaleY(1.2) scaleX(1.1);
    background: #5a1010;
  }
  #subtitulo {
    margin-top: 25px; background: rgba(0,0,0,0.7); padding: 15px 20px;
    border-radius: 15px; font-size: 22px; line-height: 1.4;
    max-width: 90vw; border-left: 5px solid gold;
  }
  #btnVolver { margin-top: 20px; background: white; color: #0b3d2e; }
</style>
</head>
<body>

<div id="panel">
  <h1>🎅 Papá Noel Pro</h1>
  <img src="santa.png" class="preview-img" id="preview">
  <input type="text" id="nombreInput" placeholder="Nombre del niño/a: Santiago">
  <textarea id="texto" placeholder="Escribí el mensaje. Usá [nombre] para el nombre."></textarea>
  <br>
  <button onclick="hablar()">🔊 HABLAR A PANTALLA COMPLETA</button>
  <button class="music-btn" onclick="toggleMusica()" id="btnMusica">🎵 Música: OFF</button>
</div>

<div id="escena">
  <div class="foto-wrap">
    <img src="santa.png" id="santaGrande">
    <div id="boca"></div>
  </div>
  <div id="subtitulo"></div>
  <button id="btnVolver" onclick="volver()">✖ Terminar</button>
</div>

<script>
  const synth = window.speechSynthesis;
  const santaGrande = document.getElementById('santaGrande');
  const preview = document.getElementById('preview');
  const boca = document.getElementById('boca');
  let musicaOn = false;
  let audioCtx;
  let musicTimer;

  function hablar() {
    let texto = document.getElementById('texto').value;
    const nombre = document.getElementById('nombreInput').value.trim();
    if (nombre) texto = texto.split('[nombre]').join(nombre);
    if (!texto.trim()) { alert('Escribí un mensaje primero'); return; }

    synth.cancel();
    // Voz grave en TODA la frase
    const fraseCompleta = "Ho ho... " + texto + " ...Ho ho!";
    const utterance = new SpeechSynthesisUtterance(fraseCompleta);
    utterance.lang = 'es-AR';
    utterance.pitch = 0.15; // voz bien grave de Papá Noel
    utterance.rate = 0.85;
    utterance.volume = 1;

    document.getElementById('panel').style.display = 'none';
    document.getElementById('escena').style.display = 'flex';
    document.getElementById('subtitulo').textContent = '“' + texto + '”';

    let esRisa = false;

    utterance.onboundary = (e) => {
      // Cada sílaba/palabra mueve boca y cara
      boca.classList.add('abierto');
      santaGrande.style.transform = `scale(1.05) rotate(${(Math.random()-0.5)*3}deg)`;
      if (esRisa) {
        boca.style.height = '60px';
        santaGrande.classList.add('riendo');
      }
      setTimeout(() => {
        boca.classList.remove('abierto');
        santaGrande.style.transform = 'scale(1)';
        boca.style.height = '40px';
      }, 130);
    };

    utterance.onstart = () => {
      santaGrande.classList.add('hablando');
      // Detecta risa en el texto
      if (fraseCompleta.toLowerCase().includes('jaja') || fraseCompleta.toLowerCase().includes('ho ho')) {
        esRisa = true;
      }
    };

    utterance.onend = () => {
      santaGrande.classList.remove('hablando');
      santaGrande.classList.remove('riendo');
      boca.classList.remove('abierto');
      volver();
    };

    synth.speak(utterance);
  }

  function volver() {
    if (synth.speaking) synth.cancel();
    document.getElementById('escena').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
  }

  function toggleMusica() {
    const btn = document.getElementById('btnMusica');
    if (musicaOn) {
      musicaOn = false; clearInterval(musicTimer);
      if (audioCtx) audioCtx.close();
      btn.textContent = '🎵 Música: OFF'; return;
    }
    musicaOn = true; btn.textContent = '🎵 Música: ON';
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const notas = [
      [329.63,0,0.3],[329.63,0.3,0.3],[329.63,0.6,0.6],
      [329.63,1.2,0.3],[329.63,1.5,0.3],[329.63,1.8,0.6],
      [329.63,2.4,0.3],[392,2.7,0.3],[261.63,3.0,0.3],[293.66,3.3,0.6],[329.63,4.2,0.9]
    ];
    function tocar() {
      notas.forEach(([freq, inicio, dur]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + inicio);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + inicio + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + inicio);
        osc.stop(audioCtx.currentTime + inicio + dur);
      });
    }
    tocar(); musicTimer = setInterval(tocar, 5300);
  }
</script>

</body>
</html>
