<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papa Noel Video Real</title>
<style>
    * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background:#121212; color:white; display:flex; justify-content:center; padding:20px; }
  .caja { width:100%; max-width:460px; }
  h1 { text-align:center; font-size:22px; }
  p.sub { text-align:center; color:#999; font-size:14px; margin-top:-5px; }
  label { display:block; margin-top:15px; font-size:14px; color:#ccc; }
  input, textarea { width:100%; padding:12px; border-radius:12px; border:1px solid #333; background:#1e1e1e; color:white; font-size:16px; margin-top:5px; }
  textarea { height:90px; }
  input[type="file"] { background:#1e1e1e; padding:10px; }
  button { width:100%; padding:16px; border:none; border-radius:30px; background:#d62828; color:white; font-size:18px; font-weight:bold; margin-top:20px; cursor:pointer; }
  button.sec { background:#25D366; }
  #estado { text-align:center; margin-top:12px; color:gold; font-weight:bold; min-height:20px; }
  #videoFinal { width:100%; border-radius:20px; margin-top:15px; display:none; background:black; }
</style>
</head>
<body>
<div class="caja">
  <h1>🎅 Papa Noel Videollamada</h1>
  <p class="sub">Voz tipo YouTube incluida. Escribis y generas.</p>

  <label>Nombre</label>
  <input type="text" id="nombre" placeholder="Santiago">

  <label>Mensaje</label>
  <textarea id="mensaje" placeholder="Hola, soy Papa Noel..."></textarea>

  <label>Voz descargada de YouTube (opcional). Si no subis nada, uso la voz que ya cree adentro.</label>
  <input type="file" id="audioFile" accept="audio/*">

  <button onclick="generar()">▶ GENERAR VIDEO</button>
  <div id="estado"></div>
  <video id="videoFinal" controls playsinline></video>
  <button id="btnDescargar" class="sec" style="display:none;" onclick="descargar()">⬇ DESCARGAR VIDEO</button>
</div>

<canvas id="canvas" width="1080" height="1080" style="display:none"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let santaImg = new Image();
santaImg.src = 'santa.png';
let audioCtx;
let videoBlob = null;
let videoUrl = null;

function setEstado(t){ document.getElementById('estado').innerText = t; }

async function generar() {
  let nombre = document.getElementById('nombre').value.trim();
  let texto = document.getElementById('mensaje').value.trim();
  if (!texto) { alert('Escribi un mensaje'); return; }
  if (nombre) texto = 'Hola ' + nombre + '. ' + texto;

  setEstado('Preparando voz tipo YouTube...');
  document.getElementById('videoFinal').style.display = 'none';
  document.getElementById('btnDescargar').style.display = 'none';

  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  let audioBuffer = null;
  let audioFile = document.getElementById('audioFile').files[0];

  // 1. Si el usuario subio una voz de YouTube, USAR ESA
  if (audioFile) {
    try {
      const ab = await audioFile.arrayBuffer();
      audioBuffer = await audioCtx.decodeAudioData(ab);
      setEstado('Usando tu voz de YouTube...');
    } catch(e) {
      setEstado('No se pudo leer tu audio, uso la voz creada');
      audioFile = null;
    }
  }

  // 2. Si no subio nada, CREAR la voz adentro como las de YouTube
  if (!audioBuffer) {
    try {
      let frase = 'Ho ho! ' + texto + ' Ho ho! Feliz Navidad!';
      // Voz de referencia YouTube: Google español, grave y lenta
      const urlVoz = 'https://api.streamelements.com/kappa/v2/speech?voice=Google%20espa%C3%B1ol&text=' + encodeURIComponent(frase);
      const res = await fetch(urlVoz);
      const blob = await res.blob();
      const ab = await blob.arrayBuffer();
      audioBuffer = await audioCtx.decodeAudioData(ab);
      setEstado('Voz creada lista...');
    } catch(e) {
      setEstado('Error con la voz: ' + e.message);
      return;
    }
  }

  try {
    await new Promise((res) => {
      if (santaImg.complete && santaImg.naturalWidth !== 0) res();
      else { santaImg.onload = res; santaImg.onerror = res; setTimeout(res, 2500); }
    });

    // 3. Preparar audio con efecto Papa Noel YouTube: grave, lento, con eco
    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.playbackRate.value = 0.85;

    const grave = audioCtx.createBiquadFilter();
    grave.type = 'lowshelf'; grave.frequency.value = 180; grave.gain.value = 18;

    const corte = audioCtx.createBiquadFilter();
    corte.type = 'lowpass'; corte.frequency.value = 1300;

    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;

    const audioDest = audioCtx.createMediaStreamDestination();
    const gainMain = audioCtx.createGain(); gainMain.gain.value = 1.6;

    // Eco simple tipo taller / video de YouTube
    const delay = audioCtx.createDelay();
    delay.delayTime.value = 0.18;
    const feedback = audioCtx.createGain();
    feedback.gain.value = 0.25;
    const wet = audioCtx.createGain();
    wet.gain.value = 0.3;

    source.connect(grave);
    grave.connect(corte);
    corte.connect(analyser);
    analyser.connect(gainMain);
    gainMain.connect(audioCtx.destination);
    gainMain.connect(audioDest);
    // ruta eco
    gainMain.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(wet);
    wet.connect(audioDest);

    // 4. Grabación
    const canvasStream = canvas.captureStream(30);
    const combined = new MediaStream([...canvasStream.getVideoTracks(), ...audioDest.stream.getAudioTracks()]);
    let mime = 'video/webm';
    if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4';
    const recorder = new MediaRecorder(combined, { mimeType: mime, videoBitsPerSecond: 5000000 });
    let chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      videoBlob = new Blob(chunks, { type: mime });
      videoUrl = URL.createObjectURL(videoBlob);
      const v = document.getElementById('videoFinal');
      v.src = videoUrl;
      v.style.display = 'block';
      document.getElementById('btnDescargar').style.display = 'block';
      setEstado('Listo. Video como videollamada, con voz real.');
    };

    const duracion = (audioBuffer.duration / 0.85) + 1.5;
    const tiempoInicio = Date.now();
    let ultimoBlink = 0;

    function dibujar() {
      if (Date.now() - tiempoInicio > duracion * 1000 + 500) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);
      let volumen = dataArray.reduce((a,b)=>a+b,0) / dataArray.length;
      if (volumen < 2) volumen = 5 + Math.random()*5;

      let escalaBoca = 0.1 + (volumen / 40);
      if (escalaBoca > 1.5) escalaBoca = 1.5;
      let estaRiendo = volumen > 55;

      // Fondo simple, tipo llamada
      ctx.fillStyle = '#1e1e1e';
      ctx.fillRect(0, 0, 1080, 1080);

      // Movimiento de cara sutil como en videollamada
      let moveX = Math.sin(Date.now() / 400) * 8 * (volumen/30 + 0.3);
      let moveY = Math.cos(Date.now() / 500) * 5 * (volumen/30 + 0.3);
      let rot = Math.sin(Date.now() / 600) * 0.02 * (volumen/30 + 0.5);
      if (estaRiendo) rot += (Math.random() - 0.5) * 0.08;

      let escala = 1 + (volumen / 600);
      let cw = 780 * escala;
      let ch = 780 * escala;

      ctx.save();
      ctx.translate(540 + moveX, 520 + moveY);
      ctx.rotate(rot);
      if (santaImg.complete && santaImg.naturalWidth !== 0) {
        ctx.drawImage(santaImg, -cw/2, -ch/2, cw, ch);
      } else {
        ctx.fillStyle = '#d62828';
        ctx.beginPath(); ctx.arc(0, 0, 300, 0, Math.PI*2); ctx.fill();
      }

      // Boca que se mueve con la voz
      ctx.fillStyle = '#2d0505';
      ctx.strokeStyle = '#ffcccc';
      ctx.lineWidth = 5;
      let bocaH = estaRiendo ? 70 + escalaBoca * 30 : 20 + escalaBoca * 45;
      let bocaW = estaRiendo ? 160 : 130;
      ctx.beginPath();
      ctx.ellipse(0, 300, bocaW/2, bocaH/2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();

      // Risa: ojos cerrados
      if (estaRiendo) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(-140, 120); ctx.lineTo(-80, 120); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(80, 120); ctx.lineTo(140, 120); ctx.stroke();
      }

      ctx.restore();

      // Parpadeo normal
      if (Date.now() - ultimoBlink > 3200 && !estaRiendo) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(400, 380, 280, 25);
        ultimoBlink = Date.now();
      }

      requestAnimationFrame(dibujar);
    }

    setEstado('Grabando... Papa Noel hablando como en videollamada');
    recorder.start();
    source.start();
    dibujar();
    source.onended = () => setTimeout(() => { try { recorder.stop(); } catch(e){} }, 600);
    setTimeout(() => { try { if (recorder.state !== 'inactive') recorder.stop(); } catch(e){} }, duracion * 1000 + 2000);

  } catch(e) {
    setEstado('Error: ' + e.message);
  }
}

function descargar() {
  if (!videoBlob) return;
  const a = document.createElement('a');
  a.href = videoUrl;
  a.download = 'papa-noel-videollamada.webm';
  a.click();
}
</script>
</body>
</html>
